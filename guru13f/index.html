function similarPairs(c, desc, noPension=true){
  if (!c) return [];
  const ids = c.ids, out = [];
  for (let i=0;i<ids.length;i++) for (let j=i+1;j<ids.length;j++){
    const a=ids[i], b=ids[j];
    if (a==="SPY"||a==="QQQ"||b==="SPY"||b==="QQQ") continue;
    if (noPension && (PENSION.has(a)||PENSION.has(b))) continue;
    if (ok(c.m[i][j])) out.push([c.m[i][j], a, b]);
  }
  return out.sort((x,y)=>desc ? y[0]-x[0] : x[0]-y[0]);
}

  const sectors = {};
  rows.forEach(r=>Object.entries(r||{}).forEach(([k,v])=>{ sectors[k]=Math.max(sectors[k]||0, v||0); }));
  const lastR = rows[rows.length-1] || {};
  const keysS = Object.keys(sectors).filter(k=>sectors[k]>=0.01).sort((a,b)=>(lastR[b]||0)-(lastR[a]||0));
  const max = Math.max(...keysS.map(k=>sectors[k]));
  const t = el("table",{class:"t heat"});
  t.append(el("thead",{}, el("tr",{}, el("th",{text:"업종"}), periods.map(p=>el("th",{class:"n",text:qLabel(p)})))));
  const tb = el("tbody");
  for (const k of keysS){
    const tr = el("tr",{}, el("td",{style:"white-space:nowrap",text:k}));
    rows.forEach((r,i)=>{ const x=(r||{})[k]||0; const tt=Math.sqrt(Math.min(1,x/max))*0.9; const td=el("td",{class:"c",text:x>=0.005?(x*100).toFixed(0):"",style:`background:${seqColor(x,max)};color:${inkOn(tt)}`}); td.title=`${k} ${qLong(periods[i])}: ${(x*100).toFixed(1)}%`; tr.append(td); });
    tb.append(tr);
  }

}

// ---------- Finviz 문자열 풀기
function fvNum(s){
  if (s==null) return null; s = String(s).trim(); if (!s || s==="-") return null;
  const m = s.replace(/,/g,"").match(/^(-?[\d.]+)\s*([TBMK])?$/i); if (!m) return null;
  const v = parseFloat(m[1]); if (isNaN(v)) return null;
  return v * ({T:1e12,B:1e9,M:1e6,K:1e3}[(m[2]||"").toUpperCase()] || 1);
}
function fvPct(s){ if (s==null) return null; s = String(s).trim(); if (!s || s==="-") return null; const v = parseFloat(s.replace(/[%,]/g,"")); return isNaN(v) ? null : v/100; }
const MON = {Jan:1,Feb:2,Mar:3,Apr:4,May:5,Jun:6,Jul:7,Aug:8,Sep:9,Oct:10,Nov:11,Dec:12};
function fvEarn(s, asof){
  const m = String(s||"").match(/^([A-Za-z]{3})\s+(\d{1,2})(?:\s+(AMC|BMO))?/); if (!m || !MON[m[1]]) return null;
  const mo = MON[m[1]], d = +m[2], when = m[3]==="AMC" ? " 장 마감 뒤" : m[3]==="BMO" ? " 장 시작 전" : "";
  const [ay, am, ad] = String(asof||"").split("-").map(Number);
  const past = am ? (mo<am || (mo===am && d<ad)) && (am-mo)<6 : false;
  return {label: past ? "최근 실적 발표" : "다음 실적 발표", text:`${mo}월 ${d}일${when}`};
}
function companyStats(c){
  if (!c) return null;
  const t = [];
  const mcap = fvNum(c.mcap), sales = fvNum(c.sales), inc = fvNum(c.income), eps = fvNum(c.eps), pe = fvNum(c.pe), fpe = fvNum(c.fpe);
  const sy = fvPct(c.sales_yoy), ey = fvPct(c.eps_yoy), pm = fvPct(c.pm);
  const yoy = x => ok(x) ? ["1년 전보다 ", el("b",{class:signCls(x),text:pct(x,1,true)})] : null;
  if (ok(mcap)) t.push(stat("회사 크기 (시가총액)", usd(mcap), null, "", "이 회사 주식을 전부 사려면 드는 돈이에요."));
  if (ok(sales)) t.push(stat("1년 매출", usd(sales), yoy(sy), "", "1년 동안 물건과 서비스를 판 금액이에요."));
  if (ok(inc)) t.push(stat("1년 순이익", inc<0 ? usd(inc)+" 적자" : usd(inc), ok(pm) && pm>0 ? `100원 팔면 ${pm*100<1?(pm*100).toFixed(1):Math.round(pm*100)}원 남아요` : null, inc<0?"down":"", "비용과 세금을 다 내고 남은 돈이에요."));
  if (ok(eps)) t.push(stat("1주가 번 돈 (EPS)", MINUS(eps.toFixed(2))+"달러", eps<0 ? (ok(ey) && ey!==0 ? `1년 전보다 적자가 ${ey>0?"줄었어요":"늘었어요"}` : null) : yoy(ey), "", "순이익을 주식 수로 나눈 값이에요."));
  if (ok(pe)) t.push(stat("이익 대비 주가 (PER)", pe.toFixed(1)+"배", ok(fpe) ? `내년 예상 이익으로는 ${fpe.toFixed(1)}배` : null, "", "주가가 1주가 번 돈의 몇 배인지예요. 낮을수록 이익에 비해 싸요."));
  else if (ok(inc) && inc<0) t.push(stat("이익 대비 주가 (PER)", "적자라 계산 안 돼요", ok(fpe) ? `내년 예상 이익으로는 ${fpe.toFixed(1)}배` : null, "", "주가가 1주가 번 돈의 몇 배인지예요. 낮을수록 이익에 비해 싸요."));
  const real = t.length;
  const dm = String(c.div||"").match(/^([\d.]+)\s*\(([\d.]+)%\)/);
  if (dm) t.push(stat("배당", `1주에 ${dm[1]}달러 (${(+dm[2]).toFixed(1)}%)`, null, "", "회사가 번 돈을 주주에게 나눠 주는 돈이에요."));
  else if (String(c.div||"").trim()==="-" && real) t.push(stat("배당", "배당이 없어요", null, "", "회사가 번 돈을 주주에게 나눠 주는 돈이에요."));
  return real || dm ? t : null;
}
function companyMore(c){
  const out = [];
  const roe = fvPct(c.roe);
  if (ok(roe)) out.push(row({title:"자기 돈으로 번 비율 (ROE)", sub: roe>=0 ? `자기 돈 100원으로 1년에 ${(roe*100).toFixed(1)}원 벌었어요` : `자기 돈 100원으로 1년에 ${(Math.abs(roe)*100).toFixed(1)}원 잃었어요`, subWrap:true}));
  const emp = fvNum(c.employees);
  if (ok(emp)) out.push(row({title:"직원 수", trail:`${Math.round(emp).toLocaleString()}명`}));
  const e = fvEarn(c.earnings, c.asof);
  if (e) out.push(row({title:e.label, trail:e.text}));
  const idx = String(c.index||"").trim(), ct = String(c.country||"").trim();
  if ((idx && idx!=="-") || (ct && ct!=="-")) out.push(row({title:"속한 지수·본사", sub:[idx && idx!=="-" ? idx : null, ct && ct!=="-" ? ct : null].filter(Boolean).join(" · "), subWrap:true}));
  return out;
}

  const L = periods.length-1;
  const gurus = Object.keys(s.h).filter(f=>!PENSION.has(f));
  const holdNow = gurus.filter(f=>(s.h[f][L]||0)>0).sort(byRank);
  const bought = gurus.filter(f=>/[NA]/.test((s.a[f]||"")[L]||"")).length, sold = gurus.filter(f=>/[RS]/.test((s.a[f]||"")[L]||"")).length;
  const holders = Object.keys(s.h).sort(byRank);
  let sel = focusFirm && s.h[focusFirm] ? focusFirm : (holdNow[0] || [...holders].sort((a,b)=>Math.max(...s.h[b])-Math.max(...s.h[a]))[0]);
  const chartBox = el("div",{class:"v"}), chipBox = el("div");
  const drawChips = () => put(chipBox, selChips(holders.map(f=>[f, `${rankOf(f)}. ${fShort(f)}`]), sel, f=>{ sel = f; drawChart(); drawChips(); }));
  blocks.push(section({title:"구루들은 지금", lead:[`구루 ${S.stats.info.gurus_n||18}곳 중 `, el("b",{text:`${holdNow.length}곳`}), "이 들고 있어요.", bought||sold ? ` 이번 분기에 ${bought}곳이 사고 ${sold}곳이 팔았어요.` : ""]},
    holdNow.length ? el("div",{class:"chips"}, holdNow.map(f=>goChip(fShort(f), ()=>{ sel = f; drawChips(); drawChart(); chartBox.scrollIntoView({block:"nearest"}); }))) : null,
    el("p",{class:"cap",text:`${qLong(periods[L])} 말 기준 · 연기금 제외 · 이름을 누르면 아래 차트에 그 구루가 사고판 때가 나와요.`})));
  // 3 숫자로 보는 회사
  const ts = c && !isEtf ? companyStats(c) : null;
  if (ts){
    const more = companyMore(c);
    blocks.push(section({title:"숫자로 보는 회사"}, el("div",{class:"stats wide"}, ts), more.length ? fold("숫자 더 보기", b=>b.append(el("div",{class:"rows"}, more))) : null,
      el("p",{class:"cap",text:`최근 12개월 기준 · ${c.asof||""} Finviz`})));
  } else if (c && !isEtf) blocks.push(section({title:"숫자로 보는 회사"}, el("p",{class:"empty",text:"이 종목은 재무 정보가 없어요."})));
  // 4 주가와 구루가 사고판 때
  blocks.push(section({title:"주가와 구루가 사고판 때"}, chipBox, chartBox));
  // 5 누가 얼마나 들고 있나
  blocks.push(fold("누가 얼마나 들고 있나", b=>{
    const t = el("table",{class:"t heat"});
    t.append(el("thead",{}, el("tr",{}, el("th",{text:"구루"}), periods.map(p=>el("th",{class:"n",text:qLabel(p)})))));
    const tb = el("tbody");
    const maxw = Math.max(1, ...holders.flatMap(f=>s.h[f]));
    for (const f of holders){
      const acts = (s.a[f]||"").split("");
      const tr = el("tr",{}, el("td",{style:"white-space:nowrap;position:sticky;left:0;background:var(--card)"}, el("b",{class:"lk",text:`${rankOf(f)}. ${fShort(f)}`,onclick:()=>{ closeSheet(); go("firm-"+f); }})));
      s.h[f].forEach((w,i)=>{ const a=acts[i]; const tt=Math.sqrt(Math.min(1,w/maxw))*0.9;
        const mark = a==="N"?"●":a==="S"?"✕":a==="A"?"▲":a==="R"?"▼":"";
        const td = el("td",{class:"c",style:`background:${w?seqColor(w,maxw):"transparent"};color:${inkOn(tt)}`,text:(w? (w>=10?w.toFixed(0):w.toFixed(1)) : "")+(mark?" "+mark:"")});
        td.title = `${firmName(f)} ${qLong(periods[i])}: 비중 ${w.toFixed(2)}%` + (a&&a!=="."&&a!=="="?` · ${({N:"신규",A:"추가",R:"축소",S:"전량매도"})[a]}`:"");
        tr.append(td); });
      tb.append(tr);
    }
    t.append(tb);
    b.append(el("p",{class:"cap",text:"구루별 비중(%) · 표 기호 — 산 분기: ● 신규 ▲ 추가 · 판 분기: ▼ 축소 ✕ 전량매도 · 옆으로 밀어서 보세요"}), el("div",{class:"scroll"}, t));
  }));
  put(body, ...blocks);
  const px = S.prices.px[k];
  function drawChart(){
    for (let i=charts.length-1;i>=0;i--) if (chartBox.contains(charts[i].canvas)){ charts[i].destroy(); charts.splice(i,1); }
    if (!px){ put(chartBox, el("p",{class:"empty",text:"주가 자료가 없는 종목이에요 (상장폐지·해외주식 등)."})); return; }
    const [b,cv] = canvasBox("chart");
    put(chartBox, keys([["주가 (수정주가, 주간)", css("--ink2")],["▲ 산 분기(신규·추가)", css("--up"), "box"],["▼ 판 분기(축소·전량)", css("--down"), "box"]]), b,
      el("p",{class:"cap",text:"▲▼는 해당 분기말 시점(실제 매매는 그 분기 중 어느 때). 공시는 최대 45일 뒤에 나와요."}));
    const D = S.prices.dates, acts = (s.a[sel]||"").split("");
    const buy = D.map(()=>null), sell = D.map(()=>null), info = {};
    acts.forEach((a,i)=>{
      if (a==="."||a==="="||!a) return;
      const qd = periods[i]; let j = D.findIndex(d=>d>=qd); if (j<0) j = D.length-1;
      if (a==="N"||a==="A") buy[j] = px[j]; else sell[j] = px[j];
      info[j] = ({N:"신규 매수",A:"추가 매수",R:"비중 축소",S:"전량 매도"})[a] + ` (${qLong(qd)}, 비중 ${(s.h[sel][i]||0).toFixed(2)}%)`;
    });
    const ch = new Chart(cv, {type:"line", data:{labels:D, datasets:[
      {label:"주가", data:px, borderColor:css("--ink2"), borderWidth:1.5, pointRadius:0, tension:0, spanGaps:true},
      {label:"매수", data:buy, showLine:false, pointStyle:"triangle", pointRadius:8, pointHoverRadius:10, backgroundColor:css("--up"), borderColor:css("--card"), borderWidth:2},
      {label:"매도", data:sell, showLine:false, pointStyle:"triangle", rotation:180, pointRadius:8, pointHoverRadius:10, backgroundColor:css("--down"), borderColor:css("--card"), borderWidth:2}]},
      options:{interaction:{mode:"index",intersect:false}, scales:{x:{grid:{display:false},ticks:dTick}, y:{grid:{color:css("--grid")},border:{display:false}}},
        plugins:{tooltip:{filter:it=>it.parsed.y!=null, callbacks:{label:ctx=> ctx.datasetIndex===0 ? ` $${ctx.parsed.y}` : ` ${info[ctx.dataIndex]||""}`}}}}, plugins:[crosshair]});
    charts.push(ch);
  }
  drawChips(); drawChart();
  body.scrollTop = 0;
}
function closeBtn(){ return el("button",{class:"xbtn",text:"닫기","aria-label":"닫기",onclick:closeSheet}); }
function closeRow(){ return el("div",{class:"h"}, el("span",{class:"fill"}), closeBtn()); }
function closeSheet(){
  $("#sheet").style.display = "none"; document.body.style.overflow = "";
  for (let i=charts.length-1;i>=0;i--) if (!document.body.contains(charts[i].canvas) || $("#sheet").contains(charts[i].canvas)){ charts[i].destroy(); charts.splice(i,1); }
}
$("#sheet .bg").addEventListener("click", closeSheet);
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeSheet(); });

// ---------- 시작
(async function(){
  try {
    chartBase();
    const [st, pr, nk] = await Promise.allSettled([getJSON("data/stats.json"), getJSON("data/profiles.json"), getJSON("data/names_ko.json")]);
    if (st.status!=="fulfilled") throw st.reason;
    S.stats = bySec(st.value);
    if (pr.status==="fulfilled" && Array.isArray(pr.value)) for (const r of pr.value) if (r && r.id) S.prof[r.id] = r;
    if (nk.status==="fulfilled" && Array.isArray(nk.value)) for (const r of nk.value) if (r && r.k) S.ko[r.k] = r;
    S.q = S.stats.info.latest;
    buildRank();
    route();
  } catch(e){
    put($("#view"), el("p",{class:"empty",text:"자료를 불러오지 못했어요. 잠시 뒤 다시 열어 주세요."}));
  }
})();
</script>
</body>
