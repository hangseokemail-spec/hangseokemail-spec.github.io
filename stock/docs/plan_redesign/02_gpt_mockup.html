<body>

<script>
const baseYear = 2026;
const integer = new Intl.NumberFormat('ko-KR', { maximumFractionDigits: 0 });
const decimal = new Intl.NumberFormat('ko-KR', { maximumFractionDigits: 2 });
const fmt = (value, formatter = integer) => formatter.format(value).replace('-', '−');

function won(value) {
  const rounded = Math.round(Math.abs(value));
  if (!rounded) return '0원';
  const eok = Math.floor(rounded / 1e8);
  const man = Math.floor(rounded % 1e8 / 1e4);
  const rest = rounded % 1e4;
  const parts = [];
  if (eok) parts.push(fmt(eok) + '억');
  if (man) parts.push((man % 1000 === 0 ? man / 1000 + '천' : fmt(man)) + '만');
  if (rest) parts.push(fmt(rest));
  return (value < 0 ? '−' : '') + parts.join(' ') + '원';
}

const duration = months => Math.floor(months / 12) + '년 ' + months % 12 + '개월';
const monthRate = rate => Math.expm1(Math.log1p(rate / 100) / 12);

function growth(months, rate) {
  const exponent = Math.log1p(rate / 100) * months / 12;
  return [Math.exp(exponent), rate === 0 ? months : Math.expm1(exponent) / monthRate(rate)];
}

function future(months, initial, monthly, rate) {
  const [principal, payments] = growth(months, rate);
  return initial * principal + monthly * payments;
}

function monthsToGoal(target, initial, monthly, rate) {
  for (let month = 0; month <= 1200; month++) {
    if (future(month, initial, monthly, rate) >= target) return month;
  }
  return null;
}

function neededRate(target, initial, monthly, months) {
  let low = -50;
  let high = 100;
  if (future(months, initial, monthly, high) < target) return null;
  if (future(months, initial, monthly, low) >= target) return low;
  while (high - low > .000001) {
    const mid = (low + high) / 2;
    if (future(months, initial, monthly, mid) >= target) high = mid;
    else low = mid;
  }
  return Math.round(high * 100) / 100;
}

const labels = { years: '기간', monthly: '매달 넣을 돈', initial: '처음 목돈', rate: '필요 수익률' };
const fields = {
  initial: ['지금 목돈', '원', 0, 1e12],
  monthly: ['매달 넣을 돈', '원', 0, 1e12],
  rate: ['연 수익률', '%', -50, 100],
  years: ['기간', '년', 0.08, 100],
  target: ['목표 금액', '원', 1, 1e12],
  yearsScale: ['기간', '년', 0, 100],
  inflation: ['물가 상승률 · 연', '%', -20, 20],
  today: ['오늘 돈', '원', 1, 1e12],
  then: ['미래 돈', '원', 1, 1e12]
};

function field(key, value, prefix) {
  const [label, unit] = fields[key];
  const reading = unit === '원';
  const hintId = prefix + '-' + key + '-hint';
  return `<label class="field"><span class="field-title">${label}</span>
    <span class="input"><input data-key="${key}" inputmode="${reading ? 'numeric' : 'decimal'}"
      value="${fmt(value, reading ? integer : decimal)}"${reading ? ` aria-describedby="${hintId}"` : ''}><span>${unit}</span></span>
    ${reading ? `<small id="${hintId}">${won(value)}</small>` : ''}</label>`;
}

function parse(input) {
  const [, unit, min, max] = fields[input.dataset.key];
  const raw = input.value.trim().replaceAll(',', '').replace('−', '-');
  const value = Number(raw);
  const valid = /^-?(?:\d+\.?\d*|\.\d+)$/.test(raw) && value >= min && value <= max &&
    (unit !== '원' || Number.isInteger(value));
  input.setAttribute('aria-invalid', String(!valid));
  if (unit === '원') input.closest('.field').querySelector('small').textContent = valid ? won(value) : '';
  return valid ? value : null;
}

function formatInput(input) {
  const value = parse(input);
  if (value !== null) input.value = fmt(value, fields[input.dataset.key][1] === '원' ? integer : decimal);
}

function mount(preview) {
  const prefix = preview.dataset.preview;
  const phone = prefix === 'phone';
  preview.append(document.querySelector('#screen').content.cloneNode(true));
  const get = selector => preview.querySelector(selector);
  const scale = get('.scale');
  const calc = get('.calculator');
  const art = get('.scale-art');
  if (phone) for (const group of art.querySelectorAll('g')) group.id += '-phone';
  get('.frame-label').textContent = phone ? '휴대폰 · 390px' : '넓은 화면 · 1280px';

  let last = 'today';
  let demoSide = 'today';
  let scaleValues;
  const state = { ask: phone ? 'rate' : 'years', target: 163860000, initial: 30000000,
    monthly: 500000, rate: 6, years: phone ? 3 : 20 };

  get('.scale-amounts').innerHTML = field('today', 1e8, prefix) + field('then', 163860000, prefix);
  get('.axle-controls').innerHTML = field('yearsScale', 20, prefix) + field('inflation', 2.5, prefix);
  const scaleInput = key => scale.querySelector(`[data-key="${key}"]`);

  function tilt(side) {
    const left = side === 'today';
    art.style.setProperty('--angle', left ? '-3.5deg' : '3.5deg');
    art.style.setProperty('--left-y', left ? '7.326px' : '-7.326px');
    art.style.setProperty('--right-y', left ? '-7.326px' : '7.326px');
    art.classList.remove('tilt');
    void art.getBoundingClientRect();
    art.classList.add('tilt');
  }

  function updateScale(edited) {
    const opposite = last === 'today' ? 'then' : 'today';
    const amount = parse(scaleInput(last));
    const years = parse(scaleInput('yearsScale'));
    const inflation = parse(scaleInput('inflation'));
    const factor = (1 + inflation / 100) ** years;
    const converted = Math.round((last === 'today' ? amount * factor : amount / factor) / 10000) * 10000;
    const error = get('.scale-error');
    const invalid = [amount, years, inflation].includes(null);
    const outOfRange = converted < 1 || converted > fields[opposite][3];
    get('.transfer').disabled = invalid || outOfRange;
    if (invalid || outOfRange) {
      error.textContent = invalid ? '금액, 기간(0~100년), 물가(−20~20%)를 확인해 주세요.' : '환산 금액은 1만원~1조원 사이여야 해요.';
      get('.same').textContent = '입력값을 확인하면 같은 가치의 금액이 표시돼요.';
      return;
    }
    scaleInput(opposite).value = fmt(converted);
    parse(scaleInput(opposite));
    const year = fmt(baseYear + Math.floor(years)).replace(',', '');
    scaleInput('then').closest('.field').querySelector('.field-title').textContent = year + '년 통장 숫자';
    scaleValues = { target: last === 'today' ? converted : amount, years };
    error.textContent = '';
    get('.same').textContent = `오늘 ${won(last === 'today' ? amount : converted)} ≈ ${year}년 ${won(scaleValues.target)} · 같은 가치`;
    if (edited === 'today' || edited === 'then') tilt(edited);
  }

  scale.addEventListener('change', event => {
    const input = event.target;
    if (!input.matches('input')) return;
    if (input.dataset.key === 'today' || input.dataset.key === 'then') last = input.dataset.key;
    formatInput(input);
    updateScale(input.dataset.key);
  });

  get('.demo').onclick = () => {
    tilt(demoSide);
    demoSide = demoSide === 'today' ? 'then' : 'today';
  };
  get('.transfer').onclick = () => {
    state.target = scaleValues.target;
    state.years = Math.max(0.08, scaleValues.years);
    if (state.ask === 'years') state.ask = 'rate';
    renderFields();
    get('.target-line input').focus();
  };

  get('.choices').innerHTML = Object.entries(labels).map(([key, label]) =>
    `<button data-ask="${key}" aria-pressed="false">${label}</button>`).join('');

  function renderFields() {
    for (const button of calc.querySelectorAll('[data-ask]')) {
      button.setAttribute('aria-pressed', String(button.dataset.ask === state.ask));
    }
    get('.target-line').innerHTML = field('target', state.target, prefix) + '<small>그해 통장에 찍힐 금액</small>';
    get('.params').innerHTML = ['initial', 'monthly', 'rate', 'years'].map(key => key === state.ask
      ? `<div class="field"><span>${labels[key]} <span class="sr-only">(계산할 값)</span></span><span class="unknown" aria-hidden="true">?</span></div>`
      : field(key, state[key], prefix)).join('');
    renderAnswer();
  }

  function renderAnswer() {
    const answer = get('.answer');
    get('.alts').replaceChildren();
    get('.calc-feedback').textContent = '';
    if (calc.querySelector('[aria-invalid="true"]')) {
      answer.textContent = '입력값을 확인해 주세요. 금액은 0원 이상, 연 수익률은 −50~100%, 기간은 1개월~100년이에요.';
      get('.apply').disabled = get('.strategy').disabled = true;
      return;
    }

    const { target, ask } = state;
    let { initial, monthly, rate } = state;
    let months = Math.round(state.years * 12);
    let headline;
    let warning = '';
    let difficult = false;
    let reference = false;
    const [principal, payments] = growth(months, rate);

    if (ask === 'years') {
      months = monthsToGoal(target, initial, monthly, rate);
      headline = months === null ? '100년 안에 목표에 닿지 못해요' : duration(months);
      difficult = months === null;
      if (difficult) {
        months = 1200;
        reference = true;
      }
    } else if (ask === 'rate') {
      const required = neededRate(target, initial, monthly, months);
      difficult = required === null || required > 30;
      headline = required === null ? '연 100%로도 목표에 닿지 못해요' : `연 ${fmt(required, decimal)}%`;
      if (difficult) warning = '수익률만으로는 목표에 닿기 어려워요.';
      else if (required > 15) warning = '꾸준히 내기 어려운 수익률이에요.';
      if (!difficult) rate = required;
      else {
        rate = 6;
        reference = true;
      }
    } else if (ask === 'initial') {
      initial = Math.max(0, Math.ceil((target - monthly * payments) / principal));
      headline = initial ? won(initial) : '매달 적립만으로 충분해요';
    } else {
      monthly = Math.max(0, Math.ceil((target - initial * principal) / payments));
      headline = monthly ? won(monthly) : '지금 목돈만으로 충분해요';
    }

    const total = future(months, initial, monthly, rate);
    const paid = initial + monthly * months;
    const gain = total - paid;
    const share = gain >= 0 ? (total ? paid / total : 1) : (paid ? total / paid : 0);
    const wonMan = value => won(Math.sign(value) * Math.round(Math.abs(value) / 10000) * 10000);
    const finishYear = baseYear + Math.floor((10 + months) / 12);
    const finishMonth = (10 + months) % 12 + 1;
    const caption = reference ? `${duration(months)} · 연 ${fmt(rate, decimal)}%로 모으면 ${wonMan(total)}`
      : ask === 'years' ? `${finishYear}년 ${finishMonth}월에 목표 도달` : `${duration(months)} 뒤 예상 금액 ${wonMan(total)}`;
    answer.innerHTML = `<div><small>${labels[ask]} 결과</small><br><strong>${headline}</strong></div>
      ${warning ? `<p class="warning">${warning}</p>` : ''}
      <small>${caption}</small>
      <div class="ratio${gain < 0 ? ' loss' : ''}" aria-hidden="true"><span style="width:${share * 100}%"></span><span style="width:${(1 - share) * 100}%"></span></div>
      <div class="bar-labels"><span>넣은 돈 <b>${wonMan(paid)}</b></span><span>${gain < 0 ? '줄어든 돈' : '불어난 돈'} <b>${wonMan(gain)}</b></span></div>`;

    if (difficult) {
      const altMonths = monthsToGoal(target, initial, monthly, rate);
      const [altGrowth, altPayments] = growth(months, rate);
      const altMonthly = Math.ceil((target - initial * altGrowth) / altPayments / 10000) * 10000;
      if (altMonths !== null) addAlternative(`연 ${fmt(rate, decimal)}%로 ${duration(altMonths)}`, { years: altMonths / 12, rate });
      if (altMonthly > 0 && altMonthly <= fields.monthly[3]) {
        addAlternative(`연 ${fmt(rate, decimal)}%로 매달 ${won(altMonthly)}`, { monthly: altMonthly, rate, years: months / 12 });
      }
    }

    get('.apply').disabled = get('.strategy').disabled = difficult;
    get('.strategy').textContent = difficult ? '투자 규칙 찾기 →' : `연 ${fmt(rate, decimal)}% 투자 규칙 찾기 →`;
    get('.apply').onclick = () => {
      get('.plan-summary').textContent = `목표 ${won(target)} · ${duration(months)} · 목돈 ${won(initial)} · 매달 ${won(monthly)} · 연 ${fmt(rate, decimal)}%`;
      get('.calc-feedback').textContent = '시안의 자세한 계획에 반영했어요.';
    };
    get('.strategy').onclick = () => {
      get('.calc-feedback').textContent = `앱에서는 연 ${fmt(rate, decimal)}%를 목표로 투자 규칙 찾기를 열어요.`;
    };
  }

  function addAlternative(label, values) {
    const button = document.createElement('button');
    button.textContent = label;
    button.onclick = () => {
      Object.assign(state, values, { ask: 'years' });
      renderFields();
      get('[data-ask="years"]').focus();
    };
    get('.alts').append(button);
  }

  calc.addEventListener('click', event => {
    if (!event.target.matches('[data-ask]')) return;
    state.ask = event.target.dataset.ask;
    renderFields();
  });
  calc.addEventListener('change', event => {
    const input = event.target;
    if (!input.matches('input')) return;
    const value = parse(input);
    if (value !== null) {
      state[input.dataset.key] = value;
      formatInput(input);
    }
    renderAnswer();
  });

  if (phone) {
    const example = get('.example');
    let longExample = false;
    example.hidden = false;
    example.onclick = () => {
      longExample = !longExample;
      Object.assign(state, { ask: 'rate', target: 163860000, initial: 30000000,
        monthly: 500000, rate: 6, years: longExample ? 10 : 3 });
      example.textContent = longExample ? '3년 대안 예시' : '10년 수익률 예시';
      renderFields();
    };
  }

  updateScale();
  renderFields();
}

document.querySelectorAll('[data-preview]').forEach(mount);
document.querySelector('#theme').onclick = event => {
  const dark = document.documentElement.dataset.theme === 'dark';
  document.documentElement.dataset.theme = dark ? 'light' : 'dark';
  event.target.textContent = dark ? '딤 다크로 보기' : '라이트로 보기';
};
</script>
</body>
</html>
