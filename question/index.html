<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#111827">
<title>Seok's Question</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;600;700&family=Playfair+Display:wght@900&display=swap">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<a class="skip" href="#content">본문으로 건너뛰기</a>
<header class="masthead">
  <div class="wrap mast-inner">
    <div class="mast-top">
      <span id="dateLabel" class="date-label">불러오는 중</span>
      <button id="archBtn" class="btn-outline" type="button" aria-controls="archPanel" aria-expanded="false">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8v13H3V8"></path><path d="M1 3h22v5H1z"></path><path d="M10 12h4"></path></svg>
        <span>지난 질문</span>
      </button>
    </div>
    <div class="mast-title">
      <h1 class="paper-name"><a href="#/">Seok's Question</a></h1>
      <p id="issueLine" class="issue-line">하나의 질문을 여러 학문의 눈으로</p>
    </div>
  </div>
</header>
<nav class="tabs-wrap" aria-label="질문 이동">
  <div id="tabs" class="wrap tabs" role="tablist"></div>
</nav>

<main id="content" class="wrap content" tabindex="-1" aria-live="polite"><p class="state">불러오는 중…</p></main>

<aside id="archPanel" class="arch-panel" aria-label="지난 질문" hidden>
  <div class="arch-head">
    <h2 class="side-title">지난 질문</h2>
    <button type="button" class="btn-ghost" data-arch-close>닫기</button>
  </div>
  <div id="archList"></div>
</aside>
<div id="archScrim" class="scrim" data-arch-close hidden></div>

<div id="detail" class="detail" hidden>
  <div class="scrim show" data-close></div>
  <section class="detail-sheet" role="dialog" aria-modal="true" aria-labelledby="detailTitle" tabindex="-1">
    <div class="detail-bar">
      <button type="button" class="btn-ghost back-btn" data-close>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg>
        <span>목록으로</span>
      </button>
      <span class="bar-name">Seok's Question</span>
    </div>
    <div id="detailBody" class="detail-body"></div>
  </section>
</div>

<footer class="wrap site-footer">
  <p>Seok's Question · 석스님의 질문 하나를 재규정하고, 여러 분야의 관점으로 조사·교차 검토·팩트체크·반론 검토를 거쳐 만든 보고서입니다. 최근 질문 5개는 위 탭에, 그보다 오래된 질문은 '지난 질문'에 있습니다.</p>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="assets/app.js" defer></script>
</body>
</html>
