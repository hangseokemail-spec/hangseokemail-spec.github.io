name: stock-fund
# Seok's Stock(/stock/) 국내 실적 DB: 금감원 OpenDART에서 분기·반기·3분기·사업보고서 손익 값을 받아 붙임
# - 저장소 Settings → Secrets → Actions의 DART_API_KEY가 있을 때만 동작(없으면 바로 끝남)
# - 처음 한 번은 2015년부터 모두 받음(약 9천 회 호출, 1시간 안팎). 그 뒤로는 새로 나온 보고서만
# - 매일 19:20 KST(공시가 하루 마감된 뒤) + Actions 탭의 'Run workflow'로 수동 실행
on:
  schedule:
    - cron: "20 10 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "국내 실적을 처음부터 다시 받기"
        type: boolean
        default: false
      probe:
        description: "계정 확인만(예: 005930:2024:11012). 비우면 평소 수집"
        type: string
        default: ""
permissions:
  contents: write
concurrency:
  group: stock-data
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: check key
        id: key
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          if [ -z "$DART_API_KEY" ]; then echo "DART_API_KEY가 아직 없어요 — Settings → Secrets and variables → Actions에 넣으면 다음 실행부터 받아요"; echo "ok=false" >> "$GITHUB_OUTPUT"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - name: probe
        if: steps.key.outputs.ok == 'true' && inputs.probe != ''
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          PROBE: ${{ inputs.probe }}
        run: |
          for p in $PROBE; do python stock/tools/fetch_fund.py --kr-probe "$p"; done
      - name: fetch
        if: steps.key.outputs.ok == 'true' && (inputs.probe == '' || inputs.probe == null)
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          FULL=""
          if [ "${{ inputs.full }}" = "true" ]; then FULL="--full"; fi
          python stock/tools/fetch_fund.py --kr-only --max-calls 15000 --max-minutes 200 $FULL
      - name: commit
        if: steps.key.outputs.ok == 'true' && (inputs.probe == '' || inputs.probe == null)
        run: |
          # 수동 실행은 실행을 건 때의 저장소로 시작하므로, 저장할 때는 늘 최신 저장소 위에 국내 실적 파일만 덮고
          # meta.json의 국내 기록은 그 자리에서 다시 쓴다(시세 봇이 그사이 meta.json을 고쳐도 부딪히지 않게)
          git config user.name "seoks-stock-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/kr
          cp stock/data/fund/KR_STOCK.json stock/data/fund/KR_raw.json stock/data/fund/dart_corp.json /tmp/kr/ 2>/dev/null || true
          ls /tmp/kr
          for i in 1 2 3 4 5; do
            git fetch -q --depth 1 origin main && git reset -q --hard origin/main
            cp /tmp/kr/* stock/data/fund/
            python stock/tools/fetch_fund.py --kr-meta
            git add stock/data/fund stock/data/meta.json
            if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
            git commit -q -m "stock: 국내 실적 갱신 $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((i*10))
          done
          exit 1
