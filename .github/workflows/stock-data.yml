name: stock-data
# Seok's Stock(/stock/) 시세 데이터베이스 갱신
# - 화~토 06:40 KST: 미국장 마감 반영 / 월~금 16:50 KST: 국내장 마감 반영 → 마지막 저장일 이후 며칠치만 받아 붙임(증분)
# - 일요일 07:10 KST: 모든 종목을 처음부터 다시 받아 점검(--full)
# - Actions 탭의 'Run workflow'로 언제든 수동 실행(전체 점검 선택 가능)
on:
  schedule:
    - cron: "40 21 * * 1-5"
    - cron: "50 7 * * 1-5"
    - cron: "10 22 * * 6"
  workflow_dispatch:
    inputs:
      full:
        description: "모든 종목을 처음부터 다시 받기"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "stock/tools/**"
      - "stock/data/extra_tickers.txt"
permissions:
  contents: write
concurrency:
  group: stock-data
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: fetch
        run: |
          FULL=""
          if [ "${{ github.event.schedule }}" = "10 22 * * 6" ] || [ "${{ inputs.full }}" = "true" ]; then FULL="--full"; fi
          python stock/tools/fetch_data.py --workers 4 $FULL
      - name: fundamentals
        # 미국 실적(SEC): 새 분기가 나올 때가 된 종목만 받아 붙임. 실패해도 시세 갱신은 계속. 국내 실적은 stock-fund.yml
        continue-on-error: true
        env:
          SEC_UA: ${{ vars.SEC_UA }}
        run: python stock/tools/fetch_fund.py --us-only
      - name: commit
        run: |
          git config user.name "seoks-stock-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stock/data
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "stock: 시세 갱신 $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep $((i*10))
          done
          exit 1
