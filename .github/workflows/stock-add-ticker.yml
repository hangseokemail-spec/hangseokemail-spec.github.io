name: stock-add-ticker
# 앱의 [추가 요청] 버튼 → 제목이 "[종목 추가]"로 시작하는 이슈 → 그 종목을 DB에 넣고 이슈를 닫음
# 저장소 주인이 연 이슈만 처리합니다.
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
concurrency:
  group: stock-data
  cancel-in-progress: false
jobs:
  add:
    if: startsWith(github.event.issue.title, '[종목 추가]') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: parse tickers
        id: parse
        env:
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'PY'
          import os, re
          text = (os.environ.get("TITLE", "") + " " + os.environ.get("BODY", "")).replace("[종목 추가]", " ")
          toks = re.findall(r"\b(?:[A-Z]{1,5}(?:-[AB])?|\d{6}|\d{5}[A-Z]|[0-9]{4}[A-Z][0-9])\b", text.upper())
          toks = [t for t in dict.fromkeys(toks) if t not in ("ETF", "KRW", "USD")][:10]
          path = "stock/data/extra_tickers.txt"
          have = set(l.split("#")[0].strip().upper() for l in open(path, encoding="utf-8"))
          new = [t for t in toks if t not in have]
          with open(path, "a", encoding="utf-8") as f:
              for t in new:
                  f.write(t + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("tickers=" + ",".join(toks) + "\n")
          print("요청:", toks, "새로 추가:", new)
          PY
      - name: fetch
        run: python stock/tools/fetch_data.py --workers 4
      - name: commit
        run: |
          git config user.name "seoks-stock-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stock/data
          if ! git diff --cached --quiet; then
            git commit -m "stock: 종목 추가 ${{ steps.parse.outputs.tickers }}"
            for i in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then break; fi
              sleep $((i*10))
            done
          fi
      - name: reply
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > reply.md
          import json, os
          want = [t for t in "${{ steps.parse.outputs.tickers }}".split(",") if t]
          u = {x["k"]: x for x in json.load(open("stock/data/universe.json", encoding="utf-8"))["items"]}
          lines = []
          for t in want:
              x = u.get(t)
              lines.append(f"- {t}: " + (f"추가됨 · {x['n']} · {x['s']}부터 {x['e']}까지" if x else "시세를 찾지 못했어요(티커를 확인해 주세요)"))
          print("DB 반영 결과\n\n" + ("\n".join(lines) or "- 티커를 찾지 못했어요") + "\n\n몇 분 뒤 앱을 새로 고치면 쓸 수 있어요.")
          PY
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body-file reply.md
          gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }}
